repos:
  # Ruff: lint with autofix, then format. Runs the uv-locked ruff so the hook
  # can never disagree with `uv run ruff` — the version lives in uv.lock only.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint (autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: ^deploy/.*\.sh$

  # JavaScript lint (Biome) — annotation static JS
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.11
    hooks:
      - id: biome-lint
        additional_dependencies: ["@biomejs/biome@2.4.11"]
        files: ^src/promptgrimoire/static/.*\.js$

  # Type checking
  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  # Docs index regeneration
  - repo: local
    hooks:
      - id: docs-index
        name: regenerate docs/_index.md
        entry: uv run python scripts/generate_docs_index.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

  # Cognitive complexity gate — blocks commits with functions > 15.
  # Runs the uv-locked complexipy (same single-source-of-truth rule as ruff/ty).
  - repo: local
    hooks:
      - id: complexipy
        name: complexipy (max cognitive complexity 15)
        entry: uv run complexipy --max-complexity-allowed=15
        language: system
        types: [python]
        # tests/: test code is not subject to complexity gates. The former
        # 16-file production exclude list was emptied by the 2026-08-17
        # refactor campaign (ty-bump branch) — every src/ and scripts/
        # function now passes at 15. Do not re-add entries; refactor instead.
        exclude: '^tests/'

  # Prune orphaned .pyc files (source deleted, stale bytecode remains)
  - repo: local
    hooks:
      - id: prune-orphan-pyc
        name: prune orphaned .pyc files
        entry: uv run python scripts/prune_orphan_pyc.py
        language: system
        always_run: true
        pass_filenames: false

  # JavaScript unit tests (vitest)
  - repo: local
    hooks:
      - id: vitest
        name: JS unit tests (vitest)
        entry: npx vitest run
        language: system
        files: ^(tests/js/.*\.test\.js|src/promptgrimoire/static/annotation-.*\.js)$
        pass_filenames: false

  # Shell script unit tests (BATS)
  - repo: local
    hooks:
      - id: bats-tests
        name: shell script unit tests (bats)
        entry: bats deploy/tests/
        language: system
        files: ^(deploy/.*\.sh|deploy/tests/.*)$
        pass_filenames: false

  # npm lockfile integrity (supply chain safety)
  - repo: local
    hooks:
      - id: lockfile-lint
        name: lockfile-lint (root)
        entry: npx lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-package-names --validate-integrity
        language: system
        files: ^package-lock\.json$
        pass_filenames: false
      - id: lockfile-lint-milkdown
        name: lockfile-lint (milkdown)
        entry: npx lockfile-lint --path src/promptgrimoire/static/milkdown/package-lock.json --type npm --allowed-hosts npm --validate-https --validate-package-names --validate-integrity
        language: system
        files: ^src/promptgrimoire/static/milkdown/package-lock\.json$
        pass_filenames: false

  # Secret scanning — blocks commits containing API keys, tokens, credentials
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve raw input corpora byte-for-byte and never rewrite generated bundles.
        exclude: &byte-preserving-paths '^(tests/fixtures/|Becky Bennett \(2\)\.json$|benchmark_word_based\.txt$|src/promptgrimoire/(elements/sortable|static/milkdown)/dist/)'
      - id: end-of-file-fixer
        exclude: *byte-preserving-paths
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '^(paper/|ai_transcripts/|src/promptgrimoire/static/milkdown/dist/)'
      - id: check-merge-conflict
